lineage:
  description: >-
    The end-to-end data path documented across the reference and the data flow engine
    page.
  path: Device publishes telemetry on v1/devices/me/telemetry -> keys are matched against
    the device/product ProductTelemetryProfile telemetry point identifiers -> stored as
    TimeseriesReading -> evaluated by the Product's default RuleChain -> may raise an
    Alarm and/or be forwarded to the tenant subscription topic tgwl/telemetry/{enterpriseId}/{productIdentifier}
