aid: cosmoplat
name: Cosmoplat
description: 'COSMOPlat (卡奥斯 COSMOPlat) is the industrial internet platform incubated
  by Haier Group and operated by COSMOPlat Digital Technology (Qingdao) Co., Ltd. Launched
  in 2017, it was China''s first self-developed industrial internet platform built
  around mass customization, digitally integrating user interaction, R&D, procurement,
  production and service across a factory and its supply chain. Its product line spans
  smart-factory and MES systems, industrial IoT device connectivity, chemical-park
  management, smart energy control, equipment health management and a D3OS digital-twin
  offering, and it has been applied across roughly twenty industries and more than
  twenty countries. The developer-facing surface is the 物联开发平台 (IoT development platform),
  which publishes a public HTML API reference covering product, device, alarm, rule-chain,
  thing-model, telemetry and device-RPC operations, alongside an MQTT telemetry publish/subscribe
  surface. COSMOPlat also runs an open-source developer community at openlab.cosmoplat.com
  and a GitHub organization at cosmoplat-dev.'
