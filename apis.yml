- name: COSMOPlat IoT Telemetry (MQTT)
  description: >-
    The MQTT publish/subscribe surface of the COSMOPlat IoT development platform, documented in 数据流转引擎
    (data flow engine). Devices publish telemetry to iot.cosmoplat.com:1883 on v1/devices/me/telemetry;
    tenants subscribe to iot-mqtt.cosmoplat.com:11883 on tgwl/telemetry/{enterpriseId}/# authenticating
    with the enterprise ID and enterprise secret.
  humanURL: https://www.cosmoplat.com/help/detail/304/1064
