apis:
- name: COSMOPlat IoT Platform OpenAPI
  description: 'The 物联开发平台 (IoT development platform) API published by COSMOPlat as
    the "OpenApi-线上" reference. Twenty-six documented operations across product management,
    device management, alarm rules, alarm records, rule chains, thing-model (telemetry
    profile) management, time-series telemetry, attribute data and device RPC. The
    reference publishes paths, methods, query/body parameters and response field tables,
    but does not publish a base URL or an authentication scheme.'
  humanURL: https://www.cosmoplat.com/help/detail/304/1038
  tags:
  - Internet of Things
  - Device Management
  - Telemetry
  - Industrial IoT
  properties:
  - type: OpenAPI
    url: openapi/cosmoplat-iot-platform-openapi.yml
  - type: Documentation
    url: https://www.cosmoplat.com/help/detail/304/1012
  - type: APIReference
    url: https://www.cosmoplat.com/help/detail/304/1038
  - type: Overlay
    url: overlays/cosmoplat-iot-platform-overlay.yaml
  - type: ErrorCatalog
    url: errors/cosmoplat-problem-types.yml
  - type: DataModel
    url: data-model/cosmoplat-data-model.yml
  x-evidence:
    verified: '2026-08-11'
    method: fetched
    reference_url: https://www.cosmoplat.com/help/detail/304/1038
    reference_http_status: 200
    documents: 26 operations with HTTP method, path template, query/body parameter
      tables and response field tables, rendered server-side as HTML.
    base_url_published: false
    base_url_note: 'The reference states no host. openapi.cosmoplat.com resolves (218.58.77.170)
      and answers every path with an identical 200 {"errCode":"UNKNOWN_ERR","errMsg":"网关入口异常。"}
      gateway envelope, including a nonsense control path — that is evidence of an
      API gateway, not evidence that these operations are served there, so no baseURL
      is asserted.'
    auth_published: false
    auth_note: No authentication scheme is documented for the REST operations. The
      MQTT telemetry surface documents enterprise-ID / enterprise-secret credentials.
- name: COSMOPlat IoT Telemetry (MQTT)
  description: 'The MQTT publish/subscribe surface of the COSMOPlat IoT development
    platform, documented in 数据流转引擎 (data flow engine). Devices publish telemetry to
    iot.cosmoplat.com:1883 on v1/devices/me/telemetry; tenants subscribe to iot-mqtt.cosmoplat.com:11883
    on tgwl/telemetry/{enterpriseId}/# authenticating with the enterprise ID and enterprise
    secret.'
  humanURL: https://www.cosmoplat.com/help/detail/304/1064
  baseURL: mqtt://iot-mqtt.cosmoplat.com:11883
  tags:
  - MQTT
  - Telemetry
  - Internet of Things
  - Events
  properties:
