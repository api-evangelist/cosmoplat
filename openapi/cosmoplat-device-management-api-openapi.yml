                  deviceCredentialsId:
                    type: string
                    description: 访问令牌
        default:
          description: 失败响应 / Failure envelope documented in 公共分类 › 状态码描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
