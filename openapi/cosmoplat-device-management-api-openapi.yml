openapi: 3.2.0
info:
  title: COSMOPlat IoT Platform Open Device Management API
  version: 线上 (online)
  summary: Device, product, alarm, rule-chain, thing-model, telemetry and RPC operations for the COSMOPlat (Kaos) industrial IoT platform.
  description: "Machine-readable transcription of the COSMOPlat 物联开发平台 (IoT development platform) \"OpenApi-线上\" reference published by COSMOPlat at https://www.cosmoplat.com/help/detail/304/1038\n\nThe provider publishes this contract as an HTML reference table only — no OpenAPI, Swagger, Postman or other machine-readable artifact is served anywhere on cosmoplat.com. This document transcribes that reference so it can be read by a machine.\n\nGAPS THE PROVIDER HAS NOT PUBLISHED (deliberately left empty here rather than guessed):\n  * No base URL / server host is stated anywhere in the reference, so `servers` is omitted.\n  * No authentication scheme is documented for these operations, so `securitySchemes` is empty.\n  * No per-operation 4xx/5xx catalogue is published; the single documented failure envelope from 公共分类 › 状态码描述 is wired as the `default` response.\n"
  contact:
    name: COSMOPlat
    email: market@cosmoplat.com
    url: https://www.cosmoplat.com/help
  x-provenance:
    authored_by: API Evangelist (catalog-authored)
    method: generated
    source: https://www.cosmoplat.com/help/detail/304/1038
    generated: '2026-08-11'
    note: Transcribed field-for-field from the provider's published HTML API reference. COSMOPlat does not publish an OpenAPI document; this is not a provider artifact. Re-harvest and replace verbatim if COSMOPlat ever serves one.
tags:
- name: Device Management
paths:
  /tenant/devicesnew:
    get:
      operationId: getTenantDevicesnew
      summary: 分页查询设备信息
      tags:
      - Device Management
      parameters:
      - name: page
        in: query
        required: true
        schema:
          type: string
        description: 页数（从0开始）
      - name: pageSize
        in: query
        required: true
        schema:
          type: string
        description: 每页最大数量
      - name: productManageId
        in: query
        required: false
        schema:
          type: string
        description: 产品配置id
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 设备标识
      - name: realName
        in: query
        required: false
        schema:
          type: string
        description: 设备名称
      - name: nodeType
        in: query
        required: false
        schema:
          type: string
        description: 节点类型： DIRECT_DEVICE:直连设备，GATEWAY_DEVICE:网关设备，GATEWAY_CHILD_DEVICE:网关子设备
      - name: active
        in: query
        required: false
        schema:
          type: string
        description: 设备状态true在线false离线
      responses:
        '200':
          description: 业务数据 / Business payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: object
                          properties:
                            entityType:
                              type: string
                              description: 固定值：DEVICE
                            id:
                              type: string
                              description: 设备ID
                          description: 设备ID
                        createdTime:
                          type: number
                          description: 创建时间
                        tenantId:
                          type: object
                          properties:
                            entityType:
                              type: string
                              description: 固定值：TENANT
                            id:
                              type: string
                              description: 租户ID
                          description: 租户
                        name:
                          type: string
                          description: 设备标识
                        realName:
                          type: string
                          description: 设备名称
                        productManageId:
                          type: object
                          properties:
                            entityType:
                              type: string
                              description: 固定值：TB_PRODUCT_MANAGE
                            id:
                              type: string
                              description: 产品ID
                          description: 产品
                        description:
                          type: string
                          description: 描述
                        image:
                          type: string
                          description: 图片
                        active:
                          type: boolean
                          description: 设备状态true在线false离线
                        nodeType:
                          type: string
                          description: 节点类型： DIRECT_DEVICE:直连设备，GATEWAY_DEVICE:网关设备，GATEWAY_CHILD_DEVICE:网关子设备
                        credentialsType:
                          type: string
                          description: 凭据类型：ACCESS_TOKEN，X509_CERTIFICATE，MQTT_BASIC，LWM2M_CREDENTIALS
                        lastActivityTime:
                          type: number
                          description: 最近在线时间
                        deviceCredentialsId:
                          type: string
                          description: 访问令牌
                    description: 业务数据
                  totalPages:
                    type: number
                    description: 总页数
                  totalElements:
                    type: number
                    description: 总条数
                  hasNext:
                    type: boolean
                    description: 是否存在下一条记录
        default:
          description: 失败响应 / Failure envelope documented in 公共分类 › 状态码描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        description: 分页查询设备信息
        url: https://www.cosmoplat.com/help/detail/304/1038
  /device:
    post:
      operationId: postDevice
      summary: 创建设备
      tags:
      - Device Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                realName:
                  type: string
                  description: 设备名称
                productManageId:
                  type: object
                  properties:
                    id:
                      type: string
                      description: 产品ID
                    entityType:
                      type: string
                      description: 固定值：TB_PRODUCT_MANAGE
      responses:
        '200':
          description: 业务数据 / Business payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: object
                    properties:
                      entityType:
                        type: string
                      id:
                        type: string
                        description: 设备ID
                    description: 设备ID
                  createdTime:
                    type: number
                    description: 创建时间
                  tenantId:
                    type: object
                    properties:
                      entityType:
                        type: string
                        description: 固定值：TENANT
                      id:
                        type: string
                        description: 租户ID
                    description: 租户
                  name:
                    type: string
                    description: 设备标识
                  realName:
                    type: string
                    description: 设备名称
                  productManageId:
                    type: object
                    properties:
                      entityType:
                        type: string
                        description: 固定值：TB_PRODUCT_MANAGE
                      id:
                        type: string
                        description: 产品ID
                    description: 产品
                  description:
                    type: string
                    description: 设备描述
                  image:
                    type: string
                    description: 图片
                  active:
                    type: string
                    description: 设备状态true在线false离线
                  lat:
                    type: string
                    description: 纬度
                  lon:
                    type: string
                    description: 经度
                  address:
                    type: string
                    description: 详细地址
        default:
          description: 失败响应 / Failure envelope documented in 公共分类 › 状态码描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        description: 创建设备
        url: https://www.cosmoplat.com/help/detail/304/1038
  /device/{deviceId}:
    delete:
      operationId: deleteDeviceByDeviceId
      summary: 删除设备
      tags:
      - Device Management
      description: 成功httpCode返回200
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功 / Success
        default:
          description: 失败响应 / Failure envelope documented in 公共分类 › 状态码描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        description: 删除设备
        url: https://www.cosmoplat.com/help/detail/304/1038
  /device/info/{deviceId}:
    get:
      operationId: getDeviceInfoByDeviceId
      summary: 获取设备详情
      tags:
      - Device Management
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 业务数据 / Business payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: object
                    properties:
                      entityType:
                        type: string
                        description: 固定值：DEVICE
                      id:
                        type: string
                        description: 设备ID
                    description: 设备ID
                  createdTime:
                    type: number
                    description: 创建时间
                  tenantId:
                    type: object
                    properties:
                      entityType:
                        type: string
                        description: 固定值：TENANT
                      id:
                        type: string
                        description: 租户ID
                    description: 租户
                  name:
                    type: string
                    description: 设备标识
                  realName:
                    type: string
                    description: 设备名称
                  type:
                    type: string
                    description: 所属产品名称
                  productManageId:
                    type: object
                    properties:
                      entityType:
                        type: string
                        description: 固定值：TB_PRODUCT_MANAGE
                      id:
                        type: string
                        description: 产品ID
                    description: 产品
                  description:
                    type: string
                    description: 设备描述
                  image:
                    type: string
                    description: 图片
                  active:
                    type: boolean
                    description: 设备状态true在线false离线
                  lat:
                    type: string
                    description: 纬度
                  lon:
                    type: string
                    description: 经度
                  address:
                    type: string
                    description: 详细地址
