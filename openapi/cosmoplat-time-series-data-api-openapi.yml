      properties:
        status:
          type: integer
          description: 状态码，和 httpCode 一致 / status code, same as the HTTP status
        message:
          type: string
          description: 状态描述 / status description
        errorCode:
          type: integer
          description: 错误码 / error code
        timestamp:
          type: string
          format: date-time
          description: 时间戳 / timestamp
