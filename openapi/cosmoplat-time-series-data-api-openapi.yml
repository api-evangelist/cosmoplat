tags:
- name: Time-series Data
paths:
  /device/meta/{deviceId}/values/timeseries:
    get:
      operationId: getDeviceMetaByDeviceIdValuesTimeseries
      summary: 查询历史设备遥测数据、查询最新设备遥测数据
      tags:
      - Time-series Data
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: true
        schema:
          type: string
        description: 页码
      - name: pageSize
        in: query
        required: true
        schema:
          type: string
        description: 数据数量
      - name: deviceTelemetryProfileId
        in: query
        required: true
        schema:
          type: string
        description: 测点名称
      responses:
        '200':
          description: 业务数据 / Business payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceId:
                          type: string
                          description: 设备ID
                        deviceRealName:
                          type: string
                          description: 设备实际名称
                        deviceName:
                          type: string
                          description: 设备名称
                        valueAsString:
                          type: string
                          description: string值
                        value:
                          type: string
                          description: 值
                        key:
                          type: string
                          description: key
                        jsonValue:
                          type: string
                          description: json值
                        strValue:
                          type: string
                          description: string值
                        booleanValue:
                          type: string
                          description: boolean值
                        longValue:
                          type: string
                          description: long值
                        doubleValue:
                          type: string
                          description: double值
                        dataType:
                          type: string
                          description: 数据类型
                        ts:
                          type: number
                          description: 时间戳
                    description: 业务数据
                  totalPages:
                    type: number
                    description: 总页数
                  totalElements:
                    type: number
                    description: 总记录数
                  hasNext:
                    type: boolean
                    description: 是否有下一条记录
        default:
          description: 失败响应 / Failure envelope documented in 公共分类 › 状态码描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
