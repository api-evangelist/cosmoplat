- target: $.paths['/rpc/oneway/{deviceId}'].post
  update:
    x-agentic-access:
      action-class: acting
      consequence: physical
      note: >-
        Fire-and-forget command dispatch to physical equipment. No idempotency key is
        available, so a retried request may re-execute the command on the device.
- target: $.paths['/rpc/twoway/{deviceId}'].post
  update:
    x-agentic-access:
      action-class: acting
      consequence: physical
      note: >-
        Request/response command dispatch to physical equipment. No idempotency key is
        available; a timeout is indistinguishable from a failure to dispatch.
