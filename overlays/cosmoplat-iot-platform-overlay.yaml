- target: $.paths['/tenant/devicesnew'].get
  update:
    x-apievangelist-note: >-
      The device list returns deviceCredentialsId — the device access token — in a plain
      collection response. Any caller able to list devices can therefore impersonate every
      one of them on the MQTT ingest broker. Consider omitting the credential from list
      responses and exposing it only on an explicit, separately-authorized read.
- target: $.paths['/deleteTelemetryProfileById/{tbProductTelemetryProfileId}'].delete
  update:
    x-apievangelist-note: >-
      Path repeats the HTTP verb. A resource-oriented form such as DELETE
      /productTelemetryProfiles/{id} would read the same to a machine and better to a
      human.
- target: $.paths['/alarm/{entityType}/getTenantAlarms'].post
  update:
    x-apievangelist-note: >-
      RPC-shaped listing. Pagination for this operation is carried in the request body
      rather than the query string, unlike the GET list operations in the same API.
